<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Accent top bar -->
  <rect width="1200" height="8" fill="url(#accent)" />

  <!-- Logo Mark -->
  <g transform="translate(100, 140)">
    <rect width="100" height="100" rx="24" fill="#4f46e5" />
    <path d="M28 32 L72 32 M50 32 L50 72" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="72" r="6" fill="#38bdf8" />
  </g>

  <!-- Title & Pill -->
  <text x="225" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="0.5">HRMS SYSTEM</text>
  <rect x="225" y="200" width="220" height="30" rx="15" fill="#312e81" />
  <text x="240" y="221" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc" letter-spacing="1">ENTERPRISE HRMS PORTAL</text>

  <!-- Main Headline -->
  <text x="100" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">Workforce, Attendance &amp;</text>
  <text x="100" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#818cf8" letter-spacing="-1">Automated Payroll System</text>

  <!-- Subheadline -->
  <text x="100" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">Multi-role dashboards • Instant Net Salary PDF reports • Live Punch-In Logs</text>

  <!-- Feature Pills -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="190" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="95" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">✓ Verified Attendance</text>

    <rect x="210" y="0" width="180" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="300" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">✓ Salary PDF Reports</text>

    <rect x="410" y="0" width="180" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="500" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f472b6" text-anchor="middle">✓ 4-Role Access</text>

    <rect x="610" y="0" width="170" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="695" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle">✓ Portfolio Ready</text>
  </g>
</svg>
